<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>BOXIUM - 離線中</title>
  <meta name="theme-color" content="#06038d" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #06038D;
      color: #fff;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      padding-bottom: calc(2rem + env(safe-area-inset-bottom, 0px));
      text-align: center;
    }
    .logo {
      width: 200px;
      max-width: 80vw;
      margin-bottom: 2rem;
      border: 3px solid #FEDD00;
      border-radius: 8px;
      padding: 12px 16px;
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #FEDD00;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.7);
      line-height: 1.6;
      max-width: 320px;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #FEDD00;
      color: #06038D;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.75rem 1.75rem;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.9; }
    .cached-note {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.4);
    }
  </style>
</head>
<body>
  <img
    src="https://d2xsxph8kpxj0f.cloudfront.net/310519663320884517/Mua4eQ38uVnrovHUJBRepi/boxium-logo-white_b9e0b1e8.png"
    alt="BOXIUM"
    class="logo"
    onerror="this.style.display='none'"
  />
  <div class="icon">📡</div>
  <h1>目前離線中</h1>
  <p>無法連接到網路。請檢查您的網路連線後再試，或繼續瀏覽已快取的頁面。</p>
  <button class="btn" onclick="window.location.reload()">
    🔄 重新連線
  </button>
  <p class="cached-note">已快取的卡牌資料仍可離線瀏覽</p>

  <script>
    // Auto-reload when back online
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
