name: Trending Cards Cache Recalculation

on:
  schedule:
    # HKT 00:00 / 06:00 / 12:00 / 18:00 (UTC 16:00 / 22:00 / 04:00 / 10:00)
    - cron: '0 16 * * *'
    - cron: '0 22 * * *'
    - cron: '0 4 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:

# This group is shared by manual, scheduled, and ingestion-triggered rebuilds.
# The calculation is idempotent, but serial execution avoids redundant overlap.
concurrency:
  group: trending-cache-recalculation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recalculate:
    name: Recalculate Homepage Trending Cards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild seven-day trending cache
        env:
          PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/githubActionsTrendingRecalc.mjs
