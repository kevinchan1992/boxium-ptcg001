name: SNKRDUNK Batch Price Update

on:
  schedule:
    - cron: '7 17 * * *'
  workflow_dispatch:
    inputs:
      skip_hours:
        description: 'Skip cards updated within N hours (default: 12)'
        required: false
        default: '12'
      parallel:
        description: 'Number of parallel workers (default: 8)'
        required: false
        default: '8'

permissions:
  contents: read

jobs:
  batch-update:
    name: Update SNKRDUNK Price History
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install script dependencies (mysql2 only, isolated from repo)
        run: |
          # Copy script + package.json to /tmp to avoid npm traversing repo root
          mkdir -p /tmp/snkrdunk-runner
          cp scripts/githubActionsBatchUpdate.mjs /tmp/snkrdunk-runner/
          cp scripts/package.json /tmp/snkrdunk-runner/
          cd /tmp/snkrdunk-runner
          npm install --ignore-scripts
          echo "Dependencies installed:"
          ls node_modules/ | head -20

      - name: Run SNKRDUNK batch update
        working-directory: /tmp/snkrdunk-runner
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PARALLEL: ${{ github.event.inputs.parallel || '8' }}
          SKIP_HOURS: ${{ github.event.inputs.skip_hours || '12' }}
          REQUEST_TIMEOUT_MS: '15000'
          MAX_CONSECUTIVE_ERR: '50'
          NODE_ENV: 'production'
        run: |
          echo "Starting SNKRDUNK batch update..."
          echo "PARALLEL=$PARALLEL, SKIP_HOURS=$SKIP_HOURS"
          node githubActionsBatchUpdate.mjs

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: batch-update-failure-${{ github.run_id }}
          path: 'scripts/*.log'
          retention-days: 7
