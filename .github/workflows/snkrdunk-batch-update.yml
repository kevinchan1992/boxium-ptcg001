name: SNKRDUNK Batch Price Update
on:
  schedule:
    # Twice daily at HKT 01:00 (UTC 17:00 prev day) and HKT 13:00 (UTC 05:00)
    - cron: '0 17 * * *'
    - cron: '0 5 * * *'
    # Weekly discovery: every Thursday at HKT 11:00 (UTC 03:00 Thursday)
    - cron: '0 3 * * 4'
  workflow_dispatch:
    inputs:
      skip_hours:
        description: 'Skip cards updated within N hours (default: 4)'
        required: false
        default: '4'
      parallel:
        description: 'Number of parallel workers (default: 8)'
        required: false
        default: '8'
      batch_limit:
        description: 'Max products per run (0=all with Smart Skip, default: 0)'
        required: false
        default: '0'
      empty_card_recheck_days:
        description: 'Re-check empty cards every N days (default: 7)'
        required: false
        default: '7'
      skip_discovery:
        description: '[Discovery] Skip discovery job (true/false, default: false)'
        required: false
        default: 'false'

# Prevent concurrent runs — if a new run is triggered while one is already running,
# cancel the in-progress run and let the new one proceed.
concurrency:
  group: snkrdunk-batch-price-update
  cancel-in-progress: false

permissions:
  contents: read
  actions: write  # Required to trigger workflow_dispatch

jobs:
  batch-update:
    name: Update SNKRDUNK Price History
    # Skip this job when triggered by the Thursday discovery cron (UTC 03:00 Thu = cron '0 3 * * 4')
    # We detect Thursday UTC 03:00 by checking the day-of-week in UTC
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && !(
        startsWith(github.event.schedule, '0 3 * * 4')
      ))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Duplicate-run guard (HKT-aware) ─────────────────────────────────────
      # GitHub's scheduler can fire multiple times on the same HKT day due to
      # queue backlog. This step checks if a SUCCESSFUL scheduled run already
      # completed today in HKT (UTC+8). If yes, skip the rest of the job.
      #
      # WHY HKT: The cron fires at UTC 17:00 (HKT 01:00) and UTC 05:00 (HKT 13:00).
      # Using UTC date would cause the guard to miss runs that crossed midnight
      # in UTC but are on the same HKT calendar day.
      - name: Check for duplicate scheduled run in last 8 hours
        if: github.event_name == 'schedule'
        id: dup_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Since we run twice daily (HKT 01:00 and 13:00), guard against
          # GitHub queue backlog duplicates by checking the last 8 hours.
          # This allows both scheduled runs to proceed while blocking true duplicates.
          NOW_EPOCH=$(date +%s)
          WINDOW_SECONDS=28800  # 8 hours
          echo "Checking for successful runs in the last 8 hours..."

          RUNS=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/snkrdunk-batch-update.yml/runs?per_page=10&status=success&event=schedule" \
            --jq '.workflow_runs[].created_at' 2>/dev/null || echo "")

          echo "Recent successful runs:"
          echo "$RUNS"

          ALREADY_RAN=false
          while IFS= read -r ts; do
            [ -z "$ts" ] && continue
            RUN_EPOCH=$(date -d "$ts" +%s 2>/dev/null || echo "0")
            DIFF=$((NOW_EPOCH - RUN_EPOCH))
            echo "  Run at $ts → $DIFF seconds ago"
            if [ "$DIFF" -lt "$WINDOW_SECONDS" ]; then
              ALREADY_RAN=true
              break
            fi
          done <<< "$RUNS"

          if [ "$ALREADY_RAN" = "true" ]; then
            echo "already_ran=true" >> "$GITHUB_OUTPUT"
            echo "⚠️  A successful scheduled run already completed within the last 8 hours. Skipping duplicate."
          else
            echo "already_ran=false" >> "$GITHUB_OUTPUT"
            echo "✅ No successful run found in the last 8 hours. Proceeding."
          fi

      - name: Skip if duplicate
        if: github.event_name == 'schedule' && steps.dup_check.outputs.already_ran == 'true'
        run: |
          echo "Duplicate run detected — exiting early to avoid redundant processing."
          exit 0
      # ────────────────────────────────────────────────────────────────────────

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install script dependencies (mysql2 only, isolated from repo)
        run: |
          mkdir -p /tmp/snkrdunk-runner
          cp scripts/githubActionsBatchUpdate.mjs /tmp/snkrdunk-runner/
          cp scripts/package.json /tmp/snkrdunk-runner/
          cd /tmp/snkrdunk-runner
          npm install --ignore-scripts
          echo "Dependencies installed:"
          ls node_modules/ | head -20

      - name: Run SNKRDUNK batch update (Smart Skip v3.0)
        working-directory: /tmp/snkrdunk-runner
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PARALLEL: ${{ github.event.inputs.parallel || '8' }}
          SKIP_HOURS: ${{ github.event.inputs.skip_hours || '4' }}
          BATCH_LIMIT: ${{ github.event.inputs.batch_limit || '0' }}
          EMPTY_CARD_RECHECK_DAYS: ${{ github.event.inputs.empty_card_recheck_days || '7' }}
          REQUEST_TIMEOUT_MS: '15000'
          MAX_CONSECUTIVE_ERR: '50'
          NODE_ENV: 'production'
        run: |
          echo "Starting SNKRDUNK batch update (Smart Skip v3.0)..."
          echo "PARALLEL=$PARALLEL, BATCH_LIMIT=$BATCH_LIMIT, SKIP_HOURS=$SKIP_HOURS, EMPTY_CARD_RECHECK_DAYS=$EMPTY_CARD_RECHECK_DAYS"
          node githubActionsBatchUpdate.mjs

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: batch-update-failure-${{ github.run_id }}
          path: 'scripts/*.log'
          retention-days: 7

  # ── Weekly SNKRDUNK Card Discovery (every Thursday HKT 11:00) ───────────────
  discovery:
    name: Discover New SNKRDUNK Cards (Weekly)
    # Run on Thursday UTC 03:00 schedule OR when manually triggered (unless skip_discovery=true)
    if: |
      (github.event_name == 'schedule' && startsWith(github.event.schedule, '0 3 * * 4')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_discovery != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Install dependencies
        working-directory: scripts
        run: npm install --omit=dev

      - name: Run SNKRDUNK Discovery
        working-directory: scripts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DELAY_MS: '400'
        run: |
          echo "Starting SNKRDUNK Discovery v2.0 (Batch Insert - Weekly Thursday HKT 11:00)"
          echo "Mode: Batch insert (no per-card HTML fetch, batch-update fills details later)"
          node githubActionsSnkrdunkDiscovery.mjs

      - name: Trigger batch-update to scrape newly discovered cards
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Discovery complete. Triggering batch-update to scrape new cards (SKIP_HOURS=0)..."
          gh workflow run snkrdunk-batch-update.yml \
            --repo ${{ github.repository }} \
            --field skip_hours=0 \
            --field parallel=8 \
            --field batch_limit=0 \
            --field skip_discovery=true
          echo "Batch-update triggered successfully. New cards will be scraped shortly."

      - name: Upload discovery logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-failure-logs-${{ github.run_id }}
          path: scripts/*.log
          retention-days: 7
