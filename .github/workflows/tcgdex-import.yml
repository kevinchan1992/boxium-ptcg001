name: TCGdex English Card Import

on:
  schedule:
    # Every Monday at HKT 04:00 (UTC Sunday 20:00)
    - cron: '0 20 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (fetch only, no DB write)'
        required: false
        default: 'false'

jobs:
  import:
    name: Import English PTCG Cards from TCGdex
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install mysql2

      - name: Run TCGdex Import
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          echo "=== TCGdex English PTCG Card Import ==="
          echo "Dry run: $DRY_RUN"
          node scripts/tcgdexImport.mjs
