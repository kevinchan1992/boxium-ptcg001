name: eBay Scraper (Parallel)

on:
  schedule:
    # HKT 08:00 / 20:00：每次僅執行一個受控低頻 collector。
    - cron: '0 0,12 * * *'
  workflow_dispatch:
    inputs:
      total_batches:
        description: 'Total number of serial jobs (default: 1; do not raise without eBay health evidence)'
        required: false
        default: '1'
      cards_per_batch:
        description: 'Max high-priority cards per job (default: 50)'
        required: false
        default: '50'
      card_ids:
        description: 'Comma-separated card IDs for single-card mode (optional)'
        required: false
        default: ''

# Only one run at a time — cancel in-progress if a new one is triggered
concurrency:
  group: ebay-scraper-parallel
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  # ── Determine matrix ────────────────────────────────────────────────────────
  setup:
    name: Setup matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      total_batches: ${{ steps.set-matrix.outputs.total_batches }}
    steps:
      - name: Set matrix
        id: set-matrix
        run: |
          TOTAL=${{ github.event.inputs.total_batches || '1' }}
          echo "total_batches=$TOTAL" >> "$GITHUB_OUTPUT"
          # Build JSON array [0, 1, 2, ..., TOTAL-1]
          MATRIX=$(python3 -c "import json; print(json.dumps(list(range(int('$TOTAL')))))")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Matrix: $MATRIX"

  # ── Parallel scraper jobs ────────────────────────────────────────────────────
  scrape:
    name: "Shard ${{ matrix.batch_index }}"
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        batch_index: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          mkdir -p /tmp/ebay-runner
          cp scripts/githubActionsEbayBatchUpdate.mjs /tmp/ebay-runner/
          cp scripts/ebayCircuitBreaker.mjs /tmp/ebay-runner/
          cp scripts/ebayCircuitBreaker.test.mjs /tmp/ebay-runner/
          cp scripts/package.json /tmp/ebay-runner/
          cd /tmp/ebay-runner
          npm install --ignore-scripts

      - name: Install Playwright Chromium
        run: |
          cd /tmp/ebay-runner
          npx playwright install chromium --with-deps

      - name: Verify eBay circuit breaker rules
        working-directory: /tmp/ebay-runner
        run: node ebayCircuitBreaker.test.mjs

      - name: Run eBay batch scraper (Shard ${{ matrix.batch_index }})
        working-directory: /tmp/ebay-runner
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BATCH_INDEX: ${{ matrix.batch_index }}
          TOTAL_BATCHES: ${{ needs.setup.outputs.total_batches }}
          CARDS_PER_BATCH: ${{ github.event.inputs.cards_per_batch || '50' }}
          CARD_IDS: ${{ github.event.inputs.card_ids || '' }}
          EBAY_TIER_MODE: hot_only
          MAX_PAGES_PER_CARD: '1'
          MAX_RETRIES: '1'
          MAX_BLOCKS_PER_RUN: '2'
          HEADLESS: 'true'
          NODE_ENV: 'production'
        run: |
          echo "Starting eBay scraper shard ${{ matrix.batch_index }} / ${{ needs.setup.outputs.total_batches }}"
          node githubActionsEbayBatchUpdate.mjs

      - name: Upload scraper summary and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ebay-scraper-shard-${{ matrix.batch_index }}-${{ github.run_id }}
          path: |
            /tmp/ebay-runner/*.log
            /tmp/ebay-runner/run-summary.json
            /tmp/ebay-runner/skipped-cards.json
          retention-days: 7
