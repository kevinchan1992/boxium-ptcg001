name: SNKRDUNK Card Discovery (Weekly)

on:
  schedule:
    # Every Thursday at HKT 11:00 (UTC 03:00 Thursday)
    - cron: '0 3 * * 4'
  workflow_dispatch:
    inputs:
      max_new_per_brand:
        description: 'Max new cards to insert per brand (default: 200)'
        required: false
        default: '200'
      max_pages_per_brand:
        description: 'Max search pages to scan per brand (default: 50)'
        required: false
        default: '50'

jobs:
  discover:
    name: Discover New SNKRDUNK Cards
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Install dependencies
        working-directory: scripts
        run: npm install --omit=dev

      - name: Run SNKRDUNK Discovery
        working-directory: scripts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MAX_NEW_PER_BRAND: ${{ github.event.inputs.max_new_per_brand || '200' }}
          MAX_PAGES_PER_BRAND: ${{ github.event.inputs.max_pages_per_brand || '50' }}
          DELAY_MS: '400'
        run: |
          echo "Starting SNKRDUNK Discovery"
          echo "MAX_NEW_PER_BRAND=$MAX_NEW_PER_BRAND"
          echo "MAX_PAGES_PER_BRAND=$MAX_PAGES_PER_BRAND"
          node githubActionsSnkrdunkDiscovery.mjs

      - name: Trigger batch update for newly discovered cards
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Discovery complete. Triggering metadata and price backfill for newly discovered cards..."
          gh workflow run snkrdunk-batch-update.yml \
            --repo ${{ github.repository }} \
            --field skip_hours=0 \
            --field parallel=8 \
            --field batch_limit=300 \
            --field skip_discovery=true
          echo "Batch update dispatched with SKIP_HOURS=0."

      - name: Upload discovery logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-failure-logs
          path: scripts/*.log
          retention-days: 7
