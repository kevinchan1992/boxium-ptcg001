name: SNKRDUNK Card Discovery (Weekly)

on:
  schedule:
    # Every Thursday at HKT 11:00 (UTC 03:00 Thursday)
    - cron: '0 3 * * 4'
  workflow_dispatch:
    inputs:
      high_water_lookback:
        description: 'Product-ID overlap behind the high-water mark (default: 10000)'
        required: false
        default: '10000'
      high_water_forward:
        description: 'Product-ID range ahead of the high-water mark (default: 2000)'
        required: false
        default: '2000'
      max_new_per_brand:
        description: 'Maximum newly discovered target TCG single cards per run (default: 1000)'
        required: false
        default: '1000'
      metadata_only:
        description: 'Skip discovery and only complete pending new-card metadata (default: false)'
        required: false
        default: 'false'
      metadata_batch_limit:
        description: 'Maximum pending cards for metadata-only completion (default: 1000)'
        required: false
        default: '1000'

jobs:
  discover:
    name: Discover New SNKRDUNK Cards
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Install dependencies
        working-directory: scripts
        run: npm install --omit=dev

      - name: Run high-water SNKRDUNK Discovery
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.metadata_only != 'true' }}
        working-directory: scripts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HIGH_WATER_LOOKBACK: ${{ github.event.inputs.high_water_lookback || '10000' }}
          HIGH_WATER_FORWARD: ${{ github.event.inputs.high_water_forward || '2000' }}
          MAX_NEW_PER_BRAND: ${{ github.event.inputs.max_new_per_brand || '1000' }}
          HIGH_WATER_CONCURRENCY: '8'
          REQUEST_TIMEOUT_MS: '8000'
        run: |
          echo "Starting SNKRDUNK high-water discovery"
          echo "HIGH_WATER_LOOKBACK=$HIGH_WATER_LOOKBACK"
          echo "HIGH_WATER_FORWARD=$HIGH_WATER_FORWARD"
          echo "MAX_NEW_PER_BRAND=$MAX_NEW_PER_BRAND"
          node githubActionsSnkrdunkDiscovery.mjs

      - name: Complete metadata for newly discovered cards
        if: success()
        working-directory: scripts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          METADATA_BATCH_LIMIT: ${{ github.event.inputs.metadata_batch_limit || '1000' }}
          METADATA_PARALLEL: '8'
          REQUEST_TIMEOUT_MS: '7000'
        run: |
          echo "High-water discovery complete. Completing new-card name, image, and card number metadata..."
          node githubActionsSnkrdunkMetadataBackfill.mjs

      - name: Trigger price-history backfill for newly discovered cards
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || github.event.inputs.metadata_only != 'true') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Metadata complete. Triggering price-history backfill..."
          gh workflow run snkrdunk-batch-update.yml \
            --repo ${{ github.repository }} \
            --field skip_hours=0 \
            --field parallel=8 \
            --field batch_limit=1000 \
            --field new_only=true \
            --field skip_discovery=true

      - name: Upload discovery logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-failure-logs
          path: scripts/*.log
          retention-days: 7
