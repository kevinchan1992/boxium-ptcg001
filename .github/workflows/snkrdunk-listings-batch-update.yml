name: SNKRDUNK Listings Batch Update

on:
  schedule:
    # Runs once daily at UTC 07:07 to stay within 2,000 min/month free quota
    # HKT: 15:07 daily
    # Budget: ~30 runs/month × 50 min = ~1,500 min/month
    - cron: '7 7 * * *'
  workflow_dispatch:
    inputs:
      parallel:
        description: 'Number of parallel workers (default: 4)'
        required: false
        default: '4'
      skip_hot_cache_hours:
        description: 'Skip cards updated within N hours (default: 1)'
        required: false
        default: '1'

permissions:
  contents: read

jobs:
  listings-batch-update:
    name: Update SNKRDUNK On-Sale Listings Cache
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          # Copy script + package.json to /tmp to avoid npm traversing repo root
          mkdir -p /tmp/snkrdunk-listings-runner
          cp scripts/githubActionsListingsBatchUpdate.mjs /tmp/snkrdunk-listings-runner/
          cp scripts/package.json /tmp/snkrdunk-listings-runner/
          cd /tmp/snkrdunk-listings-runner
          npm install --ignore-scripts

      - name: Run listings batch update
        working-directory: /tmp/snkrdunk-listings-runner
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PARALLEL: ${{ github.event.inputs.parallel || '4' }}
          SKIP_HOT_CACHE_HOURS: ${{ github.event.inputs.skip_hot_cache_hours || '1' }}
          REQUEST_TIMEOUT_MS: '12000'
          MAX_CONSECUTIVE_ERR: '30'
          NODE_ENV: 'production'
        run: node githubActionsListingsBatchUpdate.mjs

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: listings-failure-${{ github.run_id }}
          path: 'scripts/*.log'
          retention-days: 7
